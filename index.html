
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kousik</title>
    <style>
 * {
        padding: 0px;
        margin: 0px;
        box-sizing: border-box;
    }

    body {
        background-color:aqua;
    }

   .class1 {
        height: 220px;
        width: 220px;
        position: absolute;
        top: 60px;
        left: 210px;
        transform: rotate(40deg);
        border-radius: 7px;
        box-shadow: 3px 5px 3px white;
        overflow: hidden;
    }

    .class2 {
        height: 260px;
        width: 250px;
        position: absolute;
        top: 240px;
        left: 390px;
        transform: rotate(40deg);
        border-radius: 7px;
        box-shadow: 3px 5px 3px rgb(112, 112, 4);
        overflow: hidden;
    }

    .class3 {
        height: 200px;
        width: 230px;
        position: absolute;
        top: 40px;
        left: 575px;
        transform: rotate(40deg);
        border-radius: 7px;
        box-shadow: 3px 5px 3px rgb(45, 14, 221);
        overflow: hidden;
    }

    .class4 {
        height: 220px;
        width: 230px;
        position: absolute;
        top: 490px;
        left: 590px;
        transform: rotate(40deg);
        border-radius: 7px;
        box-shadow: 3px 5px 3px black;
        overflow: hidden;
    }

    .class5 {
        height: 220px;
        width: 220px;
        position: absolute;
        top: 490px;
        left: 170px;
        transform: rotate(40deg);
        border-radius: 7px;
        box-shadow: 3px 5px 3px yellow;
        overflow: hidden;
    }

    img {
        height: 140%;
        width: 140%;
        position: relative;
        top: -20%;
        left: -20%;
        border-radius: 7px;
        object-fit: cover;
        transform: rotate(-40deg);
        transition: 0.5s;
    }
 img:hover {
        transform: rotate(-40deg) scale(1.2);
    }
    </style>
</head>

<body>

    <div class="class1">
        <img src="./spiderman.jpg">
    </div>

    <div class="class2">
        <img src="./wanda.jfif">
    </div>

    <div class="class3">
        <img src="./hulk.jpg">
    </div>

    <div class="class4">
        <img src="./thor.jfif">
    </div>

    <div class="class5">
        <img src="./ironman.jpg">
    </div>
    
</body>
</html>
